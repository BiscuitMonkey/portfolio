<style>
/* Layout: the site is a frame for the work. Home = seven full-height project columns (from Jack's sketch);
   hovering one opens it wide. Project pages: a left rail of section names, the work at full width on the right. */
:root {
  --bg: #F6F6F4;
  --surface: #FFFFFF;
  --ink: #141518;
  --muted: #6B6D73;
  --line: #DDDDD9;
  --accent: #2F49F5;
  --tone-mix: 84%;
  --display: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --mono: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, .7, .12, 1);
  --gut: clamp(16px, 2vw, 28px);
  --barh: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1012; --surface: #17181B; --ink: #ECECE9; --muted: #9A9CA2; --line: #26282C;
    --accent: #8E9BFF; --tone-mix: 80%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1012; --surface: #17181B; --ink: #ECECE9; --muted: #9A9CA2; --line: #26282C;
  --accent: #8E9BFF; --tone-mix: 80%; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; padding-inline: var(--gut); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent); color: var(--bg); }
h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 500; line-height: 1.05; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.tone { background: color-mix(in oklab, var(--bg) var(--tone-mix), var(--hue, #888)); }

/* Bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--barh); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .me { font-family: var(--display); font-weight: 600; font-size: 17px; text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
.bar nav { display: flex; gap: 2px; }
.bar nav a { text-decoration: none; font-size: 14.5px; color: var(--muted); padding: 6px 12px; border-radius: 999px; transition: color .2s, background .2s; white-space: nowrap; }
.bar nav a:hover { color: var(--ink); background: color-mix(in srgb, var(--line) 70%, transparent); }
.bar nav a[aria-current="page"] { color: var(--ink); background: var(--line); }

/* Home: columns */
.cols { display: flex; height: calc(100dvh - var(--barh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--gut) - 24px); min-height: 460px; border-inline: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.col { --g: 1; flex: var(--g) 1 0; min-width: 0; position: relative; overflow: hidden; text-decoration: none; border-left: 1px solid var(--line); transition: flex-grow .7s var(--ease); isolation: isolate; }
.col:first-child { border-left: 0; }
.cols.has-active .col { --g: .62; }
.cols.has-active .col.active { --g: 3.6; }
.col .bg { position: absolute; inset: 0; z-index: -1; }
.col .bg img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(.95); opacity: .5; transition: filter .6s var(--ease), opacity .6s var(--ease), transform 1.2s var(--ease); transform: scale(1.04); }
.col.active .bg img { filter: none; opacity: 1; transform: none; }
.col .n { position: absolute; top: 16px; left: 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col .yr { position: absolute; top: 34px; left: 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.col .vt { position: absolute; left: 12px; bottom: 16px; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--display); font-size: clamp(18px, 1.7vw, 27px); letter-spacing: -0.015em; font-weight: 450; white-space: nowrap; max-height: calc(100% - 90px); overflow: hidden; text-overflow: ellipsis; transition: opacity .35s var(--ease); }
.col.active .vt { opacity: 0; }
.cols.has-active .col:not(.active) .vt { opacity: .55; }
.col .reveal { position: absolute; left: 0; bottom: 0; width: max(380px, 40vw); padding: 0 28px 26px; display: grid; gap: 12px; opacity: 0; transform: translateY(10px); transition: opacity .3s var(--ease), transform .5s var(--ease); pointer-events: none; }
.col.active .reveal { opacity: 1; transform: none; transition-delay: .22s; }
.col .reveal h2 { font-size: clamp(30px, 3.2vw, 50px); letter-spacing: -0.03em; }
.col .reveal p { max-width: 42ch; color: color-mix(in srgb, var(--ink) 82%, var(--muted)); }
.col .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.col .tags span, .chip { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); border-radius: 999px; padding: 3px 9px; color: var(--ink); }
.col .go { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 15px; margin-top: 4px; }
.col .go svg { width: 16px; height: 16px; transition: transform .4s var(--ease); }
.col.active .go svg { transform: translateX(4px); }
.col.has-img.active .reveal, .col.has-img.active .reveal .mono, .col.has-img.active .tags span { color: #fff; }
.col.has-img.active .reveal p { color: rgba(255,255,255,.85); }
.col.has-img.active .tags span { border-color: rgba(255,255,255,.4); }
.col.has-img .reveal::before { content: ""; position: absolute; inset: -80px 0 0; background: linear-gradient(transparent, rgba(0,0,0,.6)); z-index: -1; }
.home-foot { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding-block: 12px var(--gut); }

/* Pages */
.page { padding-block: clamp(36px, 6vw, 72px) 96px; max-width: 1360px; margin-inline: auto; }
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(28px, 4vw, 48px); }
.back { text-decoration: none; display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14.5px; }
.back:hover { color: var(--ink); }
.mini { display: flex; gap: 4px; flex-wrap: wrap; }
.mini a { width: 30px; height: 30px; display: grid; place-items: center; text-decoration: none; font-family: var(--mono); font-size: 10.5px; color: var(--muted); border-radius: 4px; border: 1px solid var(--line); transition: all .2s; }
.mini a:hover { color: var(--ink); border-color: var(--ink); }
.mini a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.p-title { font-size: clamp(42px, 7vw, 104px); letter-spacing: -0.045em; line-height: .95; font-weight: 450; }
.p-intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); margin-top: clamp(22px, 3vw, 36px); align-items: start; }
.lede { font-size: clamp(19px, 1.8vw, 23px); line-height: 1.45; font-weight: 350; max-width: 46ch; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; margin: 0; }
.facts dd { margin: 4px 0 0; font-weight: 500; }
.p-cover { margin-top: clamp(32px, 4vw, 56px); aspect-ratio: 16 / 8; border-radius: 6px; overflow: hidden; display: grid; place-items: center; max-width: 100%; }
.p-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.secs { margin-top: clamp(40px, 6vw, 88px); display: grid; gap: clamp(48px, 6vw, 88px); }
.sec { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px clamp(24px, 4vw, 64px); }
.sec > .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh) + 20px); align-self: start; display: grid; gap: 6px; }
.sec > .rail h2 { font-family: var(--sans); font-size: 15px; font-weight: 600; letter-spacing: 0; }
.sec > .main { display: grid; gap: 22px; min-width: 0; }
.sec .main > p, .sec .main > ul { max-width: 64ch; }
.sec ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.figs { display: grid; gap: 12px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.ph { aspect-ratio: var(--r, 4 / 3); max-width: 100%; border-radius: 4px; overflow: hidden; display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
figcaption { font-size: 13.5px; color: var(--muted); }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.nums div { border: 1px solid var(--line); border-radius: 6px; padding: 14px; background: var(--surface); }
.nums b { display: block; font-family: var(--display); font-weight: 500; font-size: 32px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.nums span { font-size: 13px; color: var(--muted); }
.note { color: var(--muted); display: flex; gap: 10px; align-items: center; }
.note::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.p-next { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 16px; margin-top: clamp(64px, 8vw, 120px); padding: clamp(22px, 3vw, 36px); border-radius: 6px; text-decoration: none; transition: transform .5s var(--ease); }
.p-next:hover { transform: translateY(-3px); }
.p-next b { display: block; font-family: var(--display); font-weight: 450; font-size: clamp(30px, 4.6vw, 64px); letter-spacing: -0.035em; line-height: 1; margin-top: 10px; }
.p-next svg { width: clamp(28px, 3vw, 40px); height: clamp(28px, 3vw, 40px); }

/* Résumé */
.r-head { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: end; }
.r-head .lede { max-width: 38ch; }
.stats { display: flex; gap: clamp(20px, 3vw, 40px); flex-wrap: wrap; justify-content: flex-end; }
.stats b { display: block; font-family: var(--display); font-weight: 450; font-size: clamp(34px, 4vw, 52px); line-height: 1; letter-spacing: -0.035em; }
.r-side { display: grid; gap: 24px; justify-items: end; }
.portrait { width: clamp(160px, 20vw, 240px); aspect-ratio: 1; border-radius: 6px; overflow: hidden; }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14.5px; font-weight: 500; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .2s; }
.btn:hover { border-color: var(--ink); }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-top: clamp(40px, 5vw, 64px); }
.tab { background: none; border: 0; padding: 12px 14px 10px; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.role { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 6px clamp(24px, 4vw, 64px); padding-block: 26px; border-bottom: 1px solid var(--line); }
.role .when { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 6px; }
.role h3 { font-size: clamp(20px, 2vw, 25px); letter-spacing: -0.02em; }
.role .org { color: var(--muted); margin-top: 2px; }
.role ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 6px; max-width: 66ch; }
.role p.t { margin-top: 10px; max-width: 66ch; }
details.earlier { padding-block: 18px; border-bottom: 1px solid var(--line); }
details.earlier summary { cursor: pointer; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Contact */
.c-mail { display: inline-block; margin-top: 20px; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 7vw, 104px); letter-spacing: -0.045em; line-height: 1; overflow-wrap: anywhere; user-select: all; }
.c-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: clamp(48px, 6vw, 80px); padding-top: 24px; border-top: 1px solid var(--line); }
.c-grid div { display: grid; gap: 4px; align-content: start; min-width: 0; overflow-wrap: anywhere; }
.c-grid a { text-decoration: none; }
.c-grid a:hover { text-decoration: underline; }

/* Visual work */
.v-index { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: clamp(32px, 4vw, 48px); }
.v-card { all: unset; box-sizing: border-box; cursor: pointer; border-radius: 6px; padding: 18px; aspect-ratio: 4 / 3; max-width: 100%; display: flex; flex-direction: column; justify-content: space-between; transition: transform .5s var(--ease); }
.v-card:hover { transform: translateY(-3px); }
.v-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.v-card b { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 2vw, 28px); letter-spacing: -0.02em; line-height: 1; }
.v-piece { margin-top: clamp(64px, 8vw, 120px); padding-top: 28px; border-top: 1px solid var(--line); scroll-margin-top: calc(var(--barh) + 16px); }
.v-piece > h2 { font-size: clamp(34px, 5vw, 64px); letter-spacing: -0.04em; font-weight: 450; }

/* View transitions */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
::view-transition-group(cover) { animation-duration: .6s; animation-timing-function: cubic-bezier(.22,.7,.12,1); }

@media (max-width: 900px) {
  .p-intro, .r-head { grid-template-columns: 1fr; }
  .stats { justify-content: flex-start; }
  .r-side { justify-items: start; }
  .sec, .role { grid-template-columns: 1fr; }
  .sec > .rail { position: static; }
  .v-index { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .c-grid { grid-template-columns: 1fr; }
}
@media (max-width: 720px), (hover: none) {
  .cols { flex-direction: column; height: auto; min-height: 0; border-inline: 0; }
  .col { flex: none; min-height: 112px; border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; padding: 16px; }
  .col:first-child { border-top: 0; }
  .col .n, .col .yr { position: static; }
  .col .n { grid-row: 1; grid-column: 1; align-self: start; }
  .col .yr { grid-row: 1; grid-column: 3; align-self: start; }
  .col .vt { position: static; writing-mode: horizontal-tb; transform: none; grid-column: 1 / -1; font-size: 26px; max-height: none; white-space: normal; opacity: 1 !important; }
  .col .reveal { display: none; }
  .col .bg img { opacity: .9; filter: none; transform: none; }
  .col .bg::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 62%, transparent); }
  .home-foot { padding-block: 20px 28px; }
}
@media (max-width: 560px) {
  .bar nav a { padding: 6px 7px; font-size: 13.5px; }
  .bar .me { font-size: 15.5px; }
  .figs { grid-template-columns: 1fr; }
  .nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mini a { width: 26px; height: 26px; }
  .p-next { grid-template-columns: 1fr; }
  .home-foot { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

/* Generated placeholder art: deterministic per image key, tinted with the project hue,
   labeled with the key so each slot says exactly which file replaces it. */
function phSrc(key, hue = "#8A8A86") {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const r1 = h % 100, r2 = (h >>> 7) % 100, v = h % 4;
  let art = "";
  if (v === 0) {
    art = `<circle cx="${200 + r1 * 6}" cy="${150 + r2 * 4}" r="300" fill="${hue}" opacity=".3"/><circle cx="${900 - r2 * 3}" cy="${700 - r1 * 2}" r="380" fill="${hue}" opacity=".18"/>`;
  } else if (v === 1) {
    let s = "";
    for (let i = 0; i < 7; i++) s += `<rect x="${-300 + i * 260}" y="-300" width="${90 + r1}" height="1500" fill="${hue}" opacity="${(0.12 + (i % 3) * 0.08).toFixed(2)}"/>`;
    art = `<g transform="rotate(${18 + r2 % 30} 600 450)">${s}</g>`;
  } else if (v === 2) {
    let s = "";
    for (let i = 1; i <= 6; i++) s += `<circle cx="${300 + r1 * 6}" cy="${280 + r2 * 4}" r="${i * 95}" fill="none" stroke="${hue}" stroke-width="22" opacity="${(0.3 - i * 0.035).toFixed(3)}"/>`;
    art = s;
  } else {
    let s = "";
    for (let gx = 0; gx < 6; gx++) for (let gy = 0; gy < 5; gy++) if ((gx * 5 + gy + r1) % 3) s += `<rect x="${60 + gx * 190}" y="${50 + gy * 175}" width="130" height="118" rx="10" fill="${hue}" opacity="${(gx + gy) % 2 ? ".22" : ".12"}"/>`;
    art = s;
  }
  const label = key.toUpperCase() + " · PLACEHOLDER";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#ECEBE7"/><rect width="1200" height="900" fill="${hue}" opacity=".14"/>${art}<rect x="34" y="822" width="${label.length * 17 + 44}" height="50" rx="8" fill="#141518" opacity=".55"/><text x="56" y="855" font-family="Menlo,Consolas,monospace" font-size="26" letter-spacing="2" fill="#FFFFFF">${label}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
function img(key, alt, hue) { return `<img src="${IMAGES[key] || phSrc(key, hue)}" alt="${esc(alt || "")}" loading="lazy">`; }
function slot(key, cap, r, hue) {
  return `<figure><div class="ph tone" style="--hue:${hue};--r:${r || "4 / 3"}">${img(key, cap, hue)}</div><figcaption>${esc(cap)}</figcaption></figure>`;
}
function figs(list, n, r, hue) { const cols = n || (list.length === 4 ? 2 : Math.min(3, list.length)); return `<div class="figs" style="--n:${cols}">${list.map(([k, c]) => slot(k, c, r, hue)).join("")}</div>`; }

/* Turn a flat list of blocks into rail sections */
function sections(body) {
  const out = []; let cur = null;
  const push = () => { if (cur && cur.items.length) out.push(cur); };
  body.forEach(b => {
    if (b.h) { push(); cur = { title: b.h, items: [] }; return; }
    if (b.steps) { push(); cur = null; b.steps.forEach((s, i) => out.push({ label: "Step " + pad(i + 1), title: s.h, items: [{ p: s.p }, ...(s.nums ? [{ nums: s.nums }] : []), ...(s.figs ? [{ figs: s.figs }] : [])] })); return; }
    if (!cur) cur = { title: "Overview", items: [] };
    cur.items.push(b);
  });
  push(); return out;
}
function renderItem(b, hue) {
  if (b.p) return `<p>${esc(b.p)}</p>`;
  if (b.list) return `<ul>${b.list.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
  if (b.figs) return figs(b.figs, b.n, b.r, hue);
  if (b.nums) return `<div class="nums">${b.nums.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  if (b.note) return `<p class="note">${esc(b.note)}</p>`;
  return "";
}
function renderSecs(body, hue) {
  return `<div class="secs">${sections(body).map(s => `<section class="sec"><div class="rail">${s.label ? `<span class="mono">${s.label}</span>` : ""}<h2>${esc(s.title)}</h2></div><div class="main">${s.items.map(b => renderItem(b, hue)).join("")}</div></section>`).join("")}</div>`;
}

function bindHome() {
  const cols = $("#cols"); if (!cols) return;
  const all = [...cols.querySelectorAll(".col")];
  const wide = () => matchMedia("(min-width: 721px) and (hover: hover)").matches;
  const set = el => { if (!wide()) return; all.forEach(c => c.classList.toggle("active", c === el)); cols.classList.toggle("has-active", !!el); };
  all.forEach(c => {
    c.addEventListener("pointerenter", () => set(c));
    c.addEventListener("focus", () => set(c));
    c.addEventListener("click", () => { all.forEach(x => (x.querySelector(".bg").style.viewTransitionName = "")); c.querySelector(".bg").style.viewTransitionName = "cover"; });
  });
  cols.addEventListener("pointerleave", () => set(null));
  cols.addEventListener("focusout", e => { if (!cols.contains(e.relatedTarget)) set(null); });
}
function bindResume() {
  const tabs = [...app.querySelectorAll('[role="tab"]')]; if (!tabs.length) return;
  const select = t => tabs.forEach(x => { const on = x === t; x.setAttribute("aria-selected", on); x.tabIndex = on ? 0 : -1; $("#" + x.getAttribute("aria-controls")).hidden = !on; });
  tabs.forEach((t, i) => { t.addEventListener("click", () => select(t)); t.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return; const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length]; select(n); n.focus(); e.preventDefault(); }); });
}
function bindContact() {
  const b = $("#copy"); if (!b) return;
  b.addEventListener("click", () => {
    const done = m => { b.textContent = m; setTimeout(() => (b.textContent = "Copy email"), 1800); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected"); };
    try { navigator.clipboard.writeText(LINKS.email).then(() => done("Copied"), fallback); } catch (e) { fallback(); }
  });
}

  const id = location.hash.slice(1);
  const p = WORK.find(w => w.id === id);
  if (p) return { key: id, html: viewProject(p), title: p.title, nav: null };
  if (id === "visual") return { key: id, html: viewVisual(), title: "Visual work", nav: "visual" };
  if (id === "resume") return { key: id, html: viewResume(), title: "Résumé", nav: "resume" };
  if (id === "contact") return { key: id, html: viewContact(), title: "Contact", nav: "contact" };
  return { key: "home", html: viewHome(), title: null, nav: null };
}
function render() {
  const v = resolve(); if (v.key === current) return;
  const fromHome = current === "home", toProject = WORK.some(w => w.id === v.key);
  const swap = () => {
    current = v.key;
    app.innerHTML = v.html;
    document.title = v.title ? `${v.title} · Jack Walker` : "Jack Walker Portfolio";
    document.querySelectorAll("#nav a").forEach(a => { if (a.getAttribute("href") === "#" + v.nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (fromHome && toProject) { const c = $("#p-cover"); if (c) c.style.viewTransitionName = "cover"; }
    window.scrollTo(0, 0);
    bindHome(); bindResume(); bindContact(); bindVisual();
  };
  if (document.startViewTransition && !reduce && current !== null) {
    const t = document.startViewTransition(swap);
    t.finished.finally(() => { const c = $("#p-cover"); if (c) c.style.viewTransitionName = ""; });
  } else swap();
}
addEventListener("hashchange", render);
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea, [role=tab]")) return;
  if (e.key === "Escape" && current !== "home") { location.hash = ""; return; }
  const i = WORK.findIndex(w => w.id === current); if (i < 0) return;
  if (e.key === "ArrowRight") location.hash = WORK[(i + 1) % WORK.length].id;
  if (e.key === "ArrowLeft") location.hash = WORK[(i - 1 + WORK.length) % WORK.length].id;
});
render();
</script>
</body>
