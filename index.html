/* Layout: the site steps back so the work leads. One readable typeface, black on white,
   one quiet ink-blue for links. Home: short intro, four large project cards, a smaller row of more work.
   Case studies: one reading column, images break out wider. */
:root {
  --bg: #FFFFFF;
  --ink: #17181B;
  --muted: #5E6168;
  --line: #E4E5E8;
  --wash: #F4F5F7;
  --link: #2343B8;
  --todo-bg: #FFF7E0;
  --todo-ink: #6B4E00;
  --todo-line: #E8C766;
  --font: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
  --text: 680px;
  --wide: 1120px;
  --ascii-rgb: 23, 24, 27;
  --ascii-invert: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --ink: #ECEDEF; --muted: #A2A5AC; --line: #2A2C30; --wash: #1B1C1F; --link: #9DB0FF;
    --todo-bg: #2A2414; --todo-ink: #F0D68A; --todo-line: #6B5A26; --ascii-rgb: 236, 237, 239; --ascii-invert: 0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --ink: #ECEDEF; --muted: #A2A5AC; --line: #2A2C30; --wash: #1B1C1F; --link: #9DB0FF;
  --todo-bg: #2A2414; --todo-ink: #F0D68A; --todo-line: #6B5A26; --ascii-rgb: 236, 237, 239; --ascii-invert: 0; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 18px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
img, video { display: block; max-width: 100%; }

.wrap { max-width: var(--wide); margin-inline: auto; }
.col { max-width: var(--text); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; }
.top .name { font-weight: 700; font-size: 18px; color: var(--ink); text-decoration: none; }
.top nav { display: flex; gap: 24px; }
.top nav a { color: var(--muted); text-decoration: none; font-size: 16px; font-weight: 500; }
.top nav a:hover, .top nav a[aria-current="page"] { color: var(--ink); }

main { padding-block: 56px 96px; }

/* Home */
.intro { display: grid; gap: 16px; padding-bottom: 56px; }
.intro h1 { font-size: clamp(30px, 4vw, 44px); font-weight: 800; letter-spacing: -0.02em; max-width: 22ch; }
.intro p { color: var(--muted); font-size: 19px; max-width: 56ch; }
.intro.has-portrait { grid-template-columns: minmax(0, 1fr) 320px; align-items: center; column-gap: 64px; }
.intro-text { display: grid; gap: 16px; }
.qlinks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.qlink { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 600; transition: border-color .2s; }
.qlink:hover { border-color: var(--ink); }
.qlink svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.qsplit a { color: inherit; text-decoration: none; }
.qsplit a:hover { text-decoration: underline; text-underline-offset: 3px; }
.qsplit i { font-style: normal; color: var(--muted); margin-inline: 2px; }
.featured { display: grid; gap: 28px; }
.featured > h2 { font-size: 20px; }
.portrait-wrap { display: grid; gap: 10px; justify-items: center; }
.ascii-reveal { position: relative; width: 100%; max-width: 320px; background: var(--wash); border-radius: 10px; overflow: hidden; cursor: crosshair; }
.ascii-reveal canvas { display: block; width: 100%; height: 100%; }
.ascii-reveal canvas.reveal { position: absolute; inset: 0; pointer-events: none; }
/* Custom cursor (fine pointers only; enabled by JS) */
#cur { display: none; }
.has-cursor #cur { display: block; position: fixed; inset: 0; z-index: 99; pointer-events: none; }
.has-cursor * { cursor: none !important; }
#cur-dot { position: fixed; left: -60px; top: -60px; width: 7px; height: 7px; border-radius: 50%; background: #FFF; mix-blend-mode: difference; transform: translate(-50%, -50%); transition: width .15s, height .15s, opacity .2s; }
#cur-ring { position: fixed; left: -60px; top: -60px; width: 30px; height: 30px; border-radius: 50%; border: 1.75px solid #FFF; mix-blend-mode: difference; transform: translate(-50%, -50%) scale(var(--cs, 1)); display: grid; place-items: center; transition: width .25s, height .25s, border-color .25s, background-color .25s, transform .15s, opacity .2s; }
#cur-glyph { font-size: 15px; line-height: 1; color: #000; opacity: 0; transition: opacity .15s; }
#cur.off #cur-dot, #cur.off #cur-ring { opacity: 0; }
#cur.link #cur-ring { width: 44px; height: 44px; border-color: #FFF; background: rgba(255, 255, 255, .15); }
#cur.zoom #cur-ring { width: 42px; height: 42px; border-color: transparent; background: #FFF; }
#cur.zoom #cur-dot { opacity: 0; }
#cur.zoom #cur-glyph { opacity: 1; }
#cur.brush #cur-ring { width: 14px; height: 14px; border-color: #FFF; }
#cur.brush #cur-dot { width: 3px; height: 3px; }
#cur.down #cur-ring { --cs: .8; }
.lb-open #cur #cur-dot, .lb-open #cur #cur-ring { opacity: 0; }
.has-cursor.lb-open * { cursor: zoom-out !important; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px 32px; }
.card { display: grid; gap: 14px; color: inherit; text-decoration: none; }
.card .shot { aspect-ratio: 16 / 10; max-width: 100%; background: var(--wash); border-radius: 8px; overflow: hidden; }
.card .shot img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card:hover .shot img { transform: scale(1.015); }
.card h2 { font-size: 24px; }
.card h2 span { color: var(--muted); font-weight: 500; }
.card p { color: var(--muted); max-width: 48ch; }
.card .meta { font-size: 15px; color: var(--muted); font-weight: 500; }
.card:hover h2 { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

.more { margin-top: 88px; padding-top: 32px; border-top: 1px solid var(--line); display: grid; gap: 28px; }
.more > h2 { font-size: 20px; }
.more .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px; }
.more .card h2 { font-size: 19px; }
.more .card p { font-size: 16px; }

/* Case study */
.back { color: var(--muted); text-decoration: none; font-size: 16px; }
.back:hover { color: var(--ink); }
.cs-head { display: grid; gap: 18px; margin-top: 28px; }
.cs-head h1 { font-size: clamp(36px, 5vw, 56px); font-weight: 800; letter-spacing: -0.025em; }
.cs-head h1 span { color: var(--muted); font-weight: 500; }
.cs-head .sum { font-size: 21px; line-height: 1.5; max-width: 40ch; font-weight: 350; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 24px; margin: 36px 0 0; padding-top: 24px; border-top: 1px solid var(--line); }
.facts div { min-width: 0; }
.facts dt { font-size: 14px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
.hero { margin-top: 40px; border-radius: 10px; overflow: hidden; background: var(--wash); }
.hero img { width: 100%; height: auto; }

.cs-body { display: grid; gap: 72px; margin-top: 72px; }
.sec { display: grid; gap: 20px; }
.sec > .col { display: grid; gap: 16px; }
.sec h2 { font-size: 28px; letter-spacing: -0.01em; }
.sec h3 { font-size: 20px; }
.sec ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.decision { display: grid; gap: 14px; padding-top: 8px; }
.decision + .decision { margin-top: 24px; }

.figs { display: grid; gap: 16px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); margin-top: 8px; }
.figs.one { max-width: 820px; margin-inline: auto; width: 100%; }
.figs.strip { --n: 6; gap: 12px; }
.strip figcaption { font-size: 13px; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; align-content: start; }
figure .img { border-radius: 8px; overflow: hidden; background: var(--wash); }
figure .img.fit img, figure .img.fit video { width: 100%; height: auto; }
figcaption { font-size: 15px; color: var(--muted); }
figure .img.fit img { cursor: zoom-in; }
#lb { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
#lb::backdrop { background: rgba(12, 13, 14, .85); }
#lb img { max-width: 94vw; max-height: 86vh; width: auto; height: auto; margin-inline: auto; border-radius: 6px; cursor: zoom-out; }
#lb p { color: #E8E9EB; text-align: center; font-size: 15px; margin: 10px 0 0; }
.phones { --n: 3; max-width: 760px; margin-inline: auto; width: 100%; }
.phones.two { --n: 2; max-width: 520px; margin-inline: auto; width: 100%; }
.dials { --n: 3; max-width: 660px; margin-inline: auto; width: 100%; }
.bare .img { background: transparent; border-radius: 0; }

.nums { display: flex; flex-wrap: wrap; gap: 16px 40px; }
.nums b { display: block; font-size: 34px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.nums span { font-size: 15px; color: var(--muted); }

.todo { background: var(--todo-bg); color: var(--todo-ink); border: 1px dashed var(--todo-line); border-radius: 8px; padding: 12px 16px; font-size: 16px; line-height: 1.5; }
.todo b { font-weight: 600; }
.draft-off .todo { display: none; }

.next { margin-top: 96px; padding-top: 28px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: baseline; }
.next span { color: var(--muted); font-size: 16px; }
.next a { font-size: 26px; font-weight: 700; text-decoration: none; color: var(--ink); }
.next a:hover { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }

/* Other work */
.piece { margin-top: 80px; padding-top: 32px; border-top: 1px solid var(--line); display: grid; gap: 20px; scroll-margin-top: 80px; }
.piece > h2 { font-size: 30px; }
.toc { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 8px; }

/* About */
.about { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 56px; align-items: start; }
.about .photo { border-radius: 10px; overflow: hidden; background: var(--wash); aspect-ratio: 1; }
.about .photo img { width: 100%; height: 100%; object-fit: cover; }
.about h1 { font-size: clamp(30px, 4vw, 44px); font-weight: 800; letter-spacing: -0.02em; }
.about .lead { font-size: 20px; line-height: 1.55; max-width: 46ch; margin-top: 18px; font-weight: 350; }
.cv { display: grid; gap: 48px; margin-top: 72px; }
.cv h2 { font-size: 22px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 32px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.row .when { color: var(--muted); font-size: 15px; padding-top: 3px; font-variant-numeric: tabular-nums; }
.row h3 { font-size: 19px; }
.row .org { color: var(--muted); font-size: 16px; }
.row ul { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 17px; max-width: 64ch; }
.contact { display: grid; gap: 6px; }
.contact .mail { font-size: clamp(22px, 3vw, 30px); font-weight: 600; user-select: all; overflow-wrap: anywhere; }
.btn { font: inherit; font-size: 15px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; justify-self: start; }
.btn:hover { border-color: var(--ink); }

footer { border-top: 1px solid var(--line); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); font-size: 15px; color: var(--muted); }
footer a { color: var(--muted); }

@media (max-width: 860px) {
  .cards, .more .cards { grid-template-columns: 1fr; gap: 44px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .about { grid-template-columns: 1fr; gap: 32px; }
  .about .photo { max-width: 220px; }
  .row { grid-template-columns: 1fr; }
  .figs.strip { --n: 3; }
  .intro.has-portrait { grid-template-columns: 1fr; }
  .portrait-wrap { justify-items: start; }
  .ascii-reveal { max-width: 260px; }

@media (max-width: 560px) {
  body { font-size: 17px; }
  main { padding-block: 36px 72px; }
  .top nav { gap: 16px; }
  .figs { --n: 1 !important; }
  .figs.strip { --n: 3 !important; }
  .figs.dials { --n: 3 !important; }
  .phones, .phones.two { --n: 2 !important; }
  .cs-body { gap: 56px; margin-top: 56px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

let portraitWidget = null;

/* ---------- Rendering ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ALL = [...FEATURED, ...MORE];
const VIDEOS = new Set(["nps-landing", "nps-alaska", "nps-denali"]);

function media(key, alt, eager) {
  const src = ASSETS[key];
  if (!src) return "";
  if (VIDEOS.has(key))
    return `<video src="${src}" controls muted playsinline preload="metadata" aria-label="${esc(alt)}"></video>`;
  return `<img src="${src}" alt="${esc(alt)}"${eager ? "" : ' loading="lazy"'}>`;
}
function figs(list, n, kind) {
  const cols = n || (list.length === 4 ? 2 : Math.min(3, list.length));
  const cls = "figs" + (kind ? " " + kind : "") + (!kind && cols === 1 ? " one" : "");
  const style = kind ? "" : ' style="--n:' + cols + '"';
  return `<div class="${cls}"${style}>${list.map(([k, c]) =>
    `<figure><div class="img fit">${media(k, c)}</div><figcaption>${esc(c)}</figcaption></figure>`).join("")}</div>`;
}
const todo = t => `<p class="todo"><b>To add:</b> ${esc(t)}</p>`;
function block(b) {
  if (b.p) return `<p class="col">${esc(b.p)}</p>`;
  if (b.list) return `<ul class="col">${b.list.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
  if (b.todo) return `<div class="col">${todo(b.todo)}</div>`;
  if (b.figs) return figs(b.figs, b.n, b.kind);
  if (b.nums) return `<div class="nums">${b.nums.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  if (b.decision) { const d = b.decision; return `<div class="decision"><div class="col" style="display:grid;gap:12px"><h3>${esc(d.h)}</h3>${d.p ? `<p>${esc(d.p)}</p>` : ""}${d.todo ? todo(d.todo) : ""}</div>${d.figs ? figs(d.figs, d.n, d.kind) : ""}</div>`; }
  return "";
}
function card(p) {
  return `<a class="card" href="#${p.id}">
    <div class="shot">${media(p.hero, "")}</div>
    <h2>${esc(p.title)}${p.sub ? ` <span>${esc(p.sub)}</span>` : ""}</h2>
    <p>${esc(p.summary)}</p>
    <span class="meta">${esc(p.meta)}</span>
  </a>`;
}

function viewHome() {
  return `<section class="intro has-portrait">
      <div class="intro-text">
        <h1>Jack Walker designs mobile and web products.</h1>
        <p>I'm a product designer finishing my BFA in UX Design at SCAD in May 2027. Most recently I redesigned title production software as a UX/UI design intern at Stewart Title.</p>
        <div class="qlinks">
          <a class="qlink" href="mailto:${EMAIL}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Email</a>
          <a class="qlink" href="${LINKEDIN}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-2 2"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-4 4a3.5 3.5 0 0 0 5 5l2-2"/></svg>LinkedIn</a>
          <a class="qlink" href="${INSTAGRAM}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>
          <span class="qlink qsplit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg><a href="${RESUME_VIEW}" target="_blank" rel="noopener">Résumé</a><i>·</i><a href="${RESUME_PDF}" target="_blank" rel="noopener">PDF</a></span>
        </div>
      </div>
      <div class="portrait-wrap">
        <figure class="ascii-reveal" id="portrait" aria-label="Portrait of Jack Walker, revealed as you move across it"></figure>
      </div>
    </section>
    <section class="featured"><h2>UX Projects</h2><div class="cards">${FEATURED.map(card).join("")}</div></section>
    <section class="more"><h2>More work</h2><div class="cards">${MORE.map(card).join("")}
      <a class="card" href="#other-work"><div class="shot">${media("gd-type", "")}</div><h2>Other work</h2><p>Graphic design, research, print and industrial design.</p><span class="meta">2023 to 2026</span></a>
    </div></section>`;
}

function viewCase(p) {
  const i = ALL.indexOf(p), next = ALL[(i + 1) % ALL.length];
  return `<article>
    <a class="back" href="#">&larr; All work</a>
    <header class="cs-head">
      <h1>${esc(p.title)}${p.sub ? ` <span>${esc(p.sub)}</span>` : ""}</h1>
      <p class="sum">${esc(p.summary)}</p>
    </header>
    <dl class="facts">${Object.entries(p.facts).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    <div class="hero">${media(p.hero, p.title + " cover", true)}</div>
    <div class="cs-body">${p.sections.map(s => `<section class="sec"><h2>${esc(s.h)}</h2>${s.blocks.map(block).join("")}</section>`).join("")}</div>
    <nav class="next" aria-label="Next project"><span>Next project</span><a href="#${next.id}">${esc(next.title)} &rarr;</a></nav>
  </article>`;
}

function viewOther() {
  return `<section class="intro" style="padding-bottom:0">
      <h1>Other work</h1>
      <p>Work outside product design that shapes how I design: illustration, print, research and 3D.</p>
      <div class="toc">${OTHER.map(o => `<a href="#other-work" data-jump="${o.id}">${esc(o.title)}</a>`).join("")}</div>
    </section>
    ${OTHER.map(o => `<section class="piece" id="o-${o.id}"><h2>${esc(o.title)}</h2><p class="col" style="color:var(--muted)">${esc(o.lede)}</p>${o.blocks.map(block).join("")}</section>`).join("")}`;
}

function row(r) {
  return `<div class="row"><div class="when">${esc(r.when)}</div><div><h3>${esc(r.title)}</h3>${r.org ? `<div class="org">${esc(r.org)}</div>` : ""}${r.bullets ? `<ul>${r.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}</div></div>`;
}
function viewAbout() {
  return `<div class="about">
      <div>
        <h1>About</h1>
        <p class="lead">I'm Jack, a product designer from Dallas, Texas, finishing my BFA in UX Design at the Savannah College of Art &amp; Design. I design mobile and web products and take them from first sketches to developer-ready files.</p>
        ${DRAFT ? `<div class="col" style="margin-top:16px">${todo("A line or two in your own voice: what kind of product work you want to do next, and where.")}</div>` : ""}
      </div>
      <div class="photo">${media("jack-walker-headshot", "Jack Walker")}</div>
    </div>
    <div class="cv">
      <section><h2>Experience</h2>${CV.experience.map(row).join("")}</section>
      <section><h2>Education</h2>${CV.education.map(row).join("")}</section>
      <section><h2>Skills</h2>${CV.skills.map(row).join("")}</section>
      <section id="contact"><h2>Contact</h2>
        <div class="contact" style="padding-top:20px">
          <span class="mail" id="mail">${EMAIL}</span>
          <button class="btn" type="button" id="copy">Copy email</button>
          <a href="${LINKEDIN}" target="_blank" rel="noopener" style="margin-top:8px">LinkedIn</a>
          ${DRAFT ? todo("A PDF of your Product Designer resume, so I can link it here.") : ""}
        </div>
      </section>
    </div>`;
}

function render() {
  const id = location.hash.replace(/^#/, "");
  const p = ALL.find(x => x.id === id);
  let html, nav = "work";
  if (p) html = viewCase(p);
  else if (id === "other-work") { html = viewOther(); nav = "other"; }
  else if (id === "about") { html = viewAbout(); nav = "about"; }
  else html = viewHome();
  if (portraitWidget) { portraitWidget.destroy(); portraitWidget = null; }
  $("#app").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.title = p ? `${p.title} · Jack Walker` : "Jack Walker Portfolio";
  window.scrollTo(0, 0);
  const pel = document.getElementById("portrait");
  if (pel) portraitWidget = new AsciiReveal(pel, ASSETS["jack-walker-headshot"], ASCII_CFG);
}

document.body.classList.toggle("draft-off", !DRAFT);
document.addEventListener("click", e => {
  const zi = e.target.closest("figure .img.fit img");
  if (zi) { const lb = $("#lb"); const li = lb.querySelector("img"); li.src = zi.src; li.alt = zi.alt || ""; lb.querySelector("p").textContent = zi.closest("figure")?.querySelector("figcaption")?.textContent || ""; document.body.classList.add("lb-open"); lb.showModal(); return; }
  if (e.target.closest("#lb")) { $("#lb").close(); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); document.getElementById("o-" + j.dataset.jump)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  if (e.target.id === "copy") {
    const done = () => { e.target.textContent = "Copied"; setTimeout(() => (e.target.textContent = "Copy email"), 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("#mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(EMAIL).then(done, sel); } catch { sel(); }
  }
});
/* Custom cursor: ink dot + trailing ring with link / zoom / brush states */
(function () {
  if (!matchMedia("(pointer: fine)").matches) return;
  const cur = $("#cur"), dot = $("#cur-dot"), ring = $("#cur-ring"), glyph = $("#cur-glyph");
  if (!cur) return;
  document.body.classList.add("has-cursor");
  cur.classList.add("off");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let x = -60, y = -60, rx = -60, ry = -60;
  addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    x = e.clientX; y = e.clientY;
    cur.classList.remove("off");
    dot.style.left = x + "px"; dot.style.top = y + "px";
    if (still) { rx = x; ry = y; ring.style.left = x + "px"; ring.style.top = y + "px"; }
  }, { passive: true });
  addEventListener("pointerdown", () => cur.classList.add("down"), true);
  addEventListener("pointerup", () => cur.classList.remove("down"), true);
  document.documentElement.addEventListener("pointerleave", () => cur.classList.add("off"));
  addEventListener("blur", () => cur.classList.add("off"));
  document.addEventListener("pointerover", e => {
    const t = e.target;
    if (!t.closest) return;
    let mode = "", g = "";
    if (t.closest(".ascii-reveal")) mode = "brush";
    else if (t.closest("figure .img.fit")) { mode = "zoom"; g = "+"; }
    else if (t.closest("a, button, summary, [data-jump]")) mode = "link";
    cur.classList.toggle("link", mode === "link");
    cur.classList.toggle("zoom", mode === "zoom");
    cur.classList.toggle("brush", mode === "brush");
    if (g) glyph.textContent = g;
  });
  if (!still) (function loop() {
    rx += (x - rx) * .18; ry += (y - ry) * .18;
    ring.style.left = rx.toFixed(1) + "px"; ring.style.top = ry.toFixed(1) + "px";
    requestAnimationFrame(loop);
  })();
  const lb = $("#lb");
  if (lb) lb.addEventListener("close", () => document.body.classList.remove("lb-open"));
})();
addEventListener("hashchange", render);
render();
</script>
