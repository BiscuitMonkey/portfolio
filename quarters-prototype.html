<title>Quarters V6</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ===== V6 · Type scale (see claude/type-styles.md) =====
   Screen title 28 · Sheet & section heading 22 · Card title 20 · Row title 15 · Body / button 14 · Meta 13 · Caption 12 · Label 11
   Numbers: header card 30 · bill amount 26 · hero / balance / totals 22 · pay sheet 40.  Card titles never outrank the headings above them. */
/* ===== V6 · Spacing system (see claude/spacing.md) ===== */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;--r-full:999px}
/* Layout: one phone-width app column, screens stacked in #stage, floating tab bar, bottom sheets. Single light look. */
:root{--nav:#FFFFFF;--nav-off:#255A9B;--nav-pill:#255A9B;--nav-on:#FFFFFF;
  --ink:#16181D; --muted:#5B606B; --ground:#F7F6F3; --card:#FFFFFF; --line:#E7E5E0; --hair:#EFEDE9;
  --well:#E9E7E2; --soft:#F1EFEA; --track:#D6D3CC; --money:#FFC83D; --chore:#255A9B; --chore-soft:#DCE6F4;
  --zelle:#6D1ED4; --good:#1F7A4D; --good-bg:#DDEFE5; --good-fg:#1F5A3A; --warn-bg:#FCE3E1; --warn-fg:#8A0500;
  --pend-bg:#FFF1C9; --pend-fg:#6B4E00; --scan:#1D1F24; --tab-off:#C9CCD3;
  --font:"Manrope", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--ground)}
@media (min-width:600px), (hover:hover) and (pointer:fine){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
/* On a real phone, opened from the Home Screen, content runs under the status bar: push the screens below it */
@media (max-width:599px) and (hover:none), (max-width:599px) and (pointer:coarse){#app{--ti:env(safe-area-inset-top,0px);position:fixed;top:0;left:0;right:0;height:var(--vh,100%)}}
html.pwa,html.pwa body{height:var(--vh,100%);overflow:hidden}
@media (max-width:599px) and (hover:none), (max-width:599px) and (pointer:coarse){html.pwa #app{position:absolute}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button{transition:transform .12s}
button:focus-visible,input:focus-visible{outline:2px solid var(--chore);outline-offset:2px}
p{margin:0}
#stage{position:absolute;inset:0;top:var(--ti,0px)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--ground);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;box-shadow:-14px 0 20px -12px rgba(22,24,29,.18)}
.scr.dark{background:var(--scan);color:#fff}
.inner{padding:var(--s5) var(--s5) 120px}
.inner.tight{padding-top:var(--s2)}
.h1{margin:0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.h1.home{font-size:26px;line-height:32px}
.h2{margin:0;font-size:22px;font-weight:800}
.sub{margin-top:var(--s1);font-size:13px;color:var(--muted)}
.sub strong{color:var(--ink)}
.lead{margin-top:var(--s2);font-size:14px;line-height:20px;color:var(--muted)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap{margin:var(--s4) 0 var(--s2);font-size:13px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.sec{margin-top:var(--s6)}
.hero2 ~ .sec{margin-top:var(--s3)} /* V5: Home rows sit closer to the hero and each other */
.hero2 ~ .sec + .sec{margin-top:var(--s2)}
.hero2 ~ .sec .grid4{margin-top:var(--s1)}
.scr.fixed{overflow-y:hidden}
.scr.fixed>.inner{padding-bottom:0}
.scr.fixed .sec{margin-top:var(--s4)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.link{border:0;background:none;padding:var(--s3) 0;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.btn{height:44px;border:0;border-radius:var(--r-full);padding:0 var(--s4);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap}
.btn.ink,.btn.chore{background:var(--chore);color:#fff} /* primary; .zelle is the same blue (purple only in pop-ups) */
.btn.out{background:var(--card);border:1.5px solid var(--ink);color:var(--ink)}
.btn.zelle{background:var(--chore);color:#fff} /* V6: Pay buttons in the app are blue... */
#sheet .btn.zelle,.tm .btn.zelle{background:var(--zelle)}
#sheet .btn.calpay,#sheet .sheetcards .btn.zelle{background:var(--chore)}
.sheetcards{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s5)}
.sheetcards .card{background:none;padding:0;border-radius:0}   /* V6: bill content sits straight on the white sheet, lined up with the date */
.sheetcards .card+.card{padding-top:var(--s4);border-top:1px solid var(--hair)}
.btn.zelle:not(.lg):not(.sm){min-width:88px;padding:0 var(--s6)} /* V6: the short "Pay" label gets a wider button */ /* V6: the day list isn't the payment pop-up, so blue */ /* ...Zelle purple only in the pop-ups where you confirm a payment (and test mode) */
.btn.danger{background:var(--card);border:1.5px solid var(--warn-fg);color:var(--warn-fg)}
.btn.danger-solid{background:var(--warn-fg);color:#fff}
.btn.lg{width:100%;height:54px;border-radius:var(--r-full);font-size:16px;font-weight:800}
.btn.wide{width:100%;height:52px;border-radius:var(--r-full);font-size:15px}
.btn.sm{height:36px;padding:0 var(--s3);border-radius:var(--r-full);font-size:13px}
.pill{font-size:11px;font-weight:700;padding:var(--s1) var(--s3);border-radius:999px;white-space:nowrap;flex:none}

.bar{width:calc(100% - 8px);max-width:32px;height:22px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink)}

/* bills */
.cal{margin-top:var(--s4);padding:var(--s4)}

.attach .btn svg{color:var(--muted)} /* V5: optional actions read quieter than the primary Add bill button */
.attfile{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);padding:var(--s3) var(--s3);border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.attfile .ft{width:36px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex:none}

.mc{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}

.wk{margin-top:var(--s4);padding:var(--s4) var(--s4) var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.wk .top{display:flex;justify-content:space-between;align-items:center}

.filter{display:flex;background:var(--well);border-radius:var(--r-md);padding:var(--s1);gap:var(--s1)}
.filter button{height:36px;padding:0 var(--s4);border:0;border-radius:var(--r-sm);background:transparent;font-size:14px;font-weight:700;transition:background .2s}

.filter.wide{position:relative}

/* V4: chore filter as a row of avatars + names (fits 6 without scrolling; scrolls beyond that). Only the ring animates. */
.whobar{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4)}
.whobtn{display:flex;align-items:center;gap:var(--s3);height:44px;padding:0 var(--s3) 0 var(--s2);border:0;border-radius:var(--r-full);background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:15px;font-weight:700;color:var(--ink);max-width:100%}

.avstack{display:flex;align-items:center;isolation:isolate} /* keep overlap z-indexes local so stacks never paint over the sticky header */
.pscroll{flex:1;min-width:0;display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px 0}

/* scroll hint: a soft shadow on whichever edge has more avatars beyond it */
.edge{position:relative;flex:1;min-width:0}

.edge::before,.edge::after{content:'';position:absolute;top:0;bottom:0;width:22px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.edge::before{left:-1px;background:radial-gradient(farthest-side at 0 50%,rgba(22,24,29,.24),rgba(22,24,29,0))}
.edge::after{right:-1px;background:radial-gradient(farthest-side at 100% 50%,rgba(22,24,29,.24),rgba(22,24,29,0))}
.edge.more-l::before,.edge.more-r::after{opacity:1}
/* V6: every sideways-scrolling row gets the same edge shadow (wrapped in .sx at render time), so it's clear it scrolls */
.sx{position:relative}
.sx::before,.sx::after{content:'';position:absolute;top:0;bottom:0;width:22px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.sx::before{left:var(--sxl,0px);background:radial-gradient(farthest-side at 0 50%,rgba(22,24,29,.24),rgba(22,24,29,0))}
.sx::after{right:var(--sxr,0px);background:radial-gradient(farthest-side at 100% 50%,rgba(22,24,29,.24),rgba(22,24,29,0))}

.pscroll>*{flex:none}
.avstack.ov>.av+.av{margin-left:-8px}
.avstack.ov>.av{position:relative;box-shadow:0 0 0 2px var(--card)}
/* earlier avatars sit on top so each check badge stays visible over its neighbour */
.avstack.ov>.av:nth-child(1){z-index:8}.avstack.ov>.av:nth-child(2){z-index:7}.avstack.ov>.av:nth-child(3){z-index:6}.avstack.ov>.av:nth-child(4){z-index:5}.avstack.ov>.av:nth-child(5){z-index:4}.avstack.ov>.av:nth-child(6){z-index:3}.avstack.ov>.av:nth-child(7){z-index:2}.avstack.ov>.av:nth-child(8){z-index:1}
.avstack.ov>.av.dash{background:var(--card)}
.avstack.sm>.av+.av{margin-left:-8px}
.pfilter{display:flex;gap:var(--s1);margin:var(--s3) -20px 0;padding:var(--s2) var(--s5) 2px;overflow-x:auto;scrollbar-width:none}
.pfilter::-webkit-scrollbar{display:none}
.pfilter button{flex:1 0 56px;display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:0;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600}

.crow{min-height:64px}

/* docs */

/* chrome */

#tabbar button{position:relative;z-index:1;flex:1;border:0;border-radius:var(--r-full);background:transparent;color:var(--nav-off);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);font-size:12px;font-weight:600}

#toast{position:absolute;left:16px;right:16px;top:calc(var(--ti,0px) + 12px);z-index:60;padding:var(--s3) var(--s4);border-radius:var(--r-md);background:#255A9B;color:#fff;font-size:14px;font-weight:700;box-shadow:0 10px 24px rgba(22,24,29,.25);transform:translateY(calc(-100% - 160px));transition:transform .38s cubic-bezier(.2,.8,.2,1);pointer-events:none;display:flex;align-items:center;gap:var(--s3);padding-right:var(--s2)}
#toast.show{transform:none;pointer-events:auto}

#toast .tx{flex:none;width:32px;height:32px;margin:-8px 0;border:0;border-radius:var(--r-full);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
#sheet{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;border:0;padding:0;background:rgba(22,24,29,.45);opacity:0;transition:opacity .3s}
.scrim:active{transform:none}
.sheet{position:relative;width:100%;max-height:88%;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}

.grab{padding:var(--s3) 0 var(--s3);touch-action:none;cursor:grab}

.sheet-body{overflow-y:auto;padding:0 var(--s5) var(--s6);overscroll-behavior:contain}

input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.flbl{display:block;margin:var(--s4) 0 var(--s2);font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;height:50px;padding:0 var(--s4);border:1px solid var(--track);border-radius:var(--r-md);background:var(--card);font:inherit;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}

.legal{margin:var(--s4) var(--s1) var(--s2);font-size:12px;line-height:17px;color:var(--muted);display:flex;flex-direction:column;gap:var(--s2)}

.tog{flex:none;position:relative;width:44px;height:26px;border-radius:var(--r-full);background:var(--well);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s,box-shadow .25s}

.tog.on{background:var(--chore);box-shadow:none}.tog.on i{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}

.chip{height:44px;padding:0 var(--s4);border-radius:var(--r-full);border:1.5px solid var(--track);background:var(--card);font-size:14px;font-weight:700;transition:background .2s,border-color .2s,color .2s}

.chips.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s1)} /* V6: day picker fills the row, 14 pt labels */

/* new home hero */
.hero2{user-select:none;-webkit-user-select:none;position:relative;margin:var(--s5) -20px 0;height:312px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.pie{position:absolute;top:calc(50% - 140px);width:280px;height:280px} /* V5: centred top-to-bottom in the band */

.hstage{position:sticky;left:0;flex:0 0 100%;margin-right:-100%;height:100%;z-index:1;pointer-events:none}
.hpies{position:absolute;inset:0;pointer-events:none;z-index:1}
/* Scroll-linked: the browser drives these from the native swipe on the compositor, at full refresh rate */
/* pies park just off-screen: half of the 280px pie + 4px */
@keyframes hpR{0%{transform:translateX(0)}50%,100%{transform:translateX(-144px)}}
@keyframes hpC{0%,50%{transform:translateX(144px)}100%{transform:translateX(0)}}
@keyframes htR{0%{opacity:1;transform:translateX(0);animation-timing-function:ease-in-out}60%,100%{opacity:0;transform:translateX(-24px)}}
@keyframes htC{0%,40%{opacity:0;transform:translateX(24px);animation-timing-function:ease-in-out}100%{opacity:1;transform:translateX(0)}}
@supports (animation-timeline: scroll()) {
  .hero2 .hp[data-i="0"]{animation:hpR linear both;animation-timeline:scroll(nearest inline)}
  .hero2 .hp[data-i="1"]{animation:hpC linear both;animation-timeline:scroll(nearest inline)}
  .hero2 .hcol[data-i="0"]{animation:htR linear both;animation-timeline:scroll(nearest inline)}
  .hero2 .hcol[data-i="1"]{animation:htC linear both;animation-timeline:scroll(nearest inline)}
}
.hp{position:absolute;inset:0;will-change:transform}
.hcols .hcol{will-change:transform,opacity}
.hcols{position:absolute;inset:0;pointer-events:none;z-index:2}

.hcol{position:absolute;top:0;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:var(--s3)}

.htitle{margin:-12px 0 var(--s2);font-size:20px;font-weight:800;letter-spacing:-.01em} /* V5: a touch bigger, lifted above the figures */
.hcol[data-i="0"]{align-items:flex-end;text-align:right} /* V5: rent column right-aligned */
.hcol .hbar{align-self:stretch}
.hcol[data-i="0"] .sub{white-space:nowrap} /* "Your share: $400 due Oct 30" stays on one line */
.hbar{display:block;height:8px;border-radius:4px;overflow:hidden}

/* ===== V6 · No strokes =====================================================
   Removes the 1px outlines around cards, panels and controls. Everything is
   gated on html.nostroke, so to REVERT set NOSTROKE = false (top of the
   script) or delete this block. Borders are made transparent rather than
   removed, so sizes and spacing don't move by a pixel either way.
   Kept on purpose: row dividers inside cards, outline buttons (.btn.out and
   the red Delete), dashed "add" buttons, dashed avatar rings, the scanned-page
   illustration, and the test-mode tools. */
.nostroke .card,.nostroke .wk,.nostroke .soon,.nostroke .folder,.nostroke .pop,.nostroke .attfile{border-color:transparent!important}
.nostroke .hero2{border-top-color:transparent;border-bottom-color:transparent}
.nostroke #tabbar{box-shadow:0 10px 28px rgba(22,24,29,.14),0 2px 6px rgba(22,24,29,.06)}
.nostroke .whobtn,.nostroke .tog{box-shadow:none}
/* slightly darker, barely-warm app background so white cards still separate without a stroke (V5: #F7F6F3) */
html.nostroke{--ground:#F4F3EF}
.nostroke #navfade{background:linear-gradient(to bottom,rgba(244,243,239,0),rgba(244,243,239,.85) 45%,#F4F3EF 75%)}
/* controls that relied on their outline to be seen get a soft fill instead */
.nostroke .hbtn.ghost{border-color:transparent;background:var(--soft)}
.nostroke .hbtn.ghost.hdr{background:var(--card)} /* on the page background (header), a white disc like the cards */
.nostroke .input,.nostroke .tm textarea{border-color:transparent;background:var(--soft)}
.nostroke .search .input{background:var(--card)} /* on the page, the search field is a white surface like the cards */
html.nostroke{--well:#E7E5E0;--soft:#F4F3EF} /* wells (switch track, round icon buttons) and input fills in the same barely-warm family */
.nostroke .chip:not([aria-pressed="true"]){border-color:transparent;background:var(--soft)}

/* ===== V6 · Button system ==================================================
   Gated on html.btnsys. To REVERT set BTNSYS = false (top of the script).
   Primary   solid blue          .btn.ink / .chore / .zelle (Zelle purple only in pop-ups)
   Secondary blue label, thin blue outline (1.25) on white   .btn.out
   Destructive  red label on a red tint (request) / solid red (final confirm)   .btn.danger / .danger-solid
   Add-something  grey dashed   .dashbtn        Link  black, underlined (V5 style)   .link
   Sizes  small 36 · regular 44 · large 54.  Every button presses: darker + 97% on touch. */
.btnsys .btn.out{border:1.25px solid var(--chore);background:var(--card);color:var(--chore)} /* secondary: thin blue outline (was black 1.5) */
.btnsys .btn.danger{border-color:transparent;background:var(--warn-bg);color:var(--warn-fg)}
.btnsys .btn.wide{height:54px;font-size:16px;font-weight:800}
.btnsys .btn,.btnsys .hbtn,.btnsys .dashbtn,.btnsys .mbtn,.btnsys .chip,.btnsys .link{transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .12s}
.btnsys .btn:active,.btnsys .hbtn:active,.btnsys .dashbtn:active,.btnsys .mbtn:active,.btnsys .chip:active{transform:scale(.97);filter:brightness(.92)}
.btnsys .link:active{opacity:.6}
</style>

<script>
var BTNSYS = true; /* V6: false = V5 button styles (black outlines, underlined links, no press state) */
document.documentElement.classList.toggle('btnsys', BTNSYS);
var NOSTROKE = true; /* V6: false = bring the V5 card/control outlines back */
document.documentElement.classList.toggle('nostroke', NOSTROKE);
(function () {
'use strict';
var TODAY = 26;
/* V4 roster: up to 8 roommates. The demo household uses the first D.size of them (3-8, set in Settings). */
var ROSTER = [
  { id: 'N', name: 'Natalia', first: 'Natalia', bg: '#F7A57D', soft: '#F6DBCD' },
  { id: 'M', name: 'Maya', first: 'Maya', bg: '#8DD3AA', soft: '#D6EBDD' },
  { id: 'J', name: 'You', first: 'You', bg: '#FFC83D', soft: '#FAE3A3' },
  { id: 'A', name: 'Alex', first: 'Alex', bg: '#7FA6EC', soft: '#DCE5F6' },
  { id: 'S', name: 'Sam', first: 'Sam', bg: '#C3A6EE', soft: '#EADFFA' },
  { id: 'P', name: 'Priya', first: 'Priya', bg: '#F4A3C4', soft: '#FADDE9' },
  { id: 'L', name: 'Leo', first: 'Leo', bg: '#7FD1CF', soft: '#D4EFEE' },
  { id: 'G', name: 'Grace', first: 'Grace', bg: '#C5E37A', soft: '#EAF5CC' }
];
var MIN_P = 3, MAX_P = ROSTER.length;
var PEOPLE = [], ALL = [], NP = 0; /* everything that used to split 4 ways now splits NP ways */
function setRoster(n) {
  n = Math.max(MIN_P, Math.min(MAX_P, +n || 5));
  PEOPLE.length = 0; ROSTER.slice(0, n).forEach(function (p) { PEOPLE.push(p); });
  ALL = PEOPLE.map(function (p) { return p.id; }); NP = n;
}

  });

  bi.forEach(function (x) {
    if (!x.posted) return;
    m.houseTotal += x.b.total; m.paidTotal += x.share * x.paidCount;

/* V6: shared date helpers. Day numbers are counted from Oct 1 2026 (32 = Nov 1, 0 = Sep 30) so all the old October maths still works. */
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function odate(n) { return new Date(2026, 9, n); }
function onum(dt) { return Math.round((new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()) - new Date(2026, 9, 1)) / 864e5) + 1; }
function weekOf(n) { return Math.floor((n - 25) / 7); }   /* 0 = this week (Sun Oct 25 - Sat Oct 31) */
function shortDate(n) { var d = odate(n); return MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function longDate(n) { var d = odate(n); return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function weekTitle(w) { var s = 25 + 7 * w, e = s + 6, a = odate(s), b = odate(e); return shortDate(s) + ' – ' + (a.getMonth() === b.getMonth() ? b.getDate() : shortDate(e)); }

    '<div class="calfoot"' + (weekFoot ? ' data-week="' + esc(weekFoot) + '"' : '') + '>' + foot + '</div></section>';

function calCells(cellFn) {

/* which day of this week (Sun Oct 25 - Sat Oct 31) a chore falls on */
var DOW = { Sun: 25, Mon: 26, Tue: 27, Wed: 28, Thu: 29, Fri: 30, Sat: 31 };
function choreDay(c) {

  var m3 = /Due (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d+)/.exec(c.due);   /* V6: monthly chores due outside this week */
  if (m3) return onum(new Date(2026, 'JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(m3[1]) / 3, +m3[2]));

          '<span class="hbar" style="background:#93ACCB"><span class="anim-w" data-key="home-cbar" data-to="' + m.chorePct + '%" style="width:0%;background:#255A9B"></span></span>' +
          '<p class="sub" style="margin:0">Your share: <strong>' + me.done + '</strong> of <strong>' + me.total + '</strong>, due Sunday</p>' +
          '<button class="btn chore" style="align-self:flex-start;font-size:15px" data-act="tab" data-to="chores">See Chores</button></div>' +
    '</div></div><div class="slide" aria-label="Household rent"></div><div class="slide" aria-label="Household chores"></div></div><div class="dots" id="dots"><button data-act="slide" data-i="0" aria-label="Show household rent"><span></span></button><button data-act="slide" data-i="1" aria-label="Show household chores"><span></span></button></div></section>' +
    '<section class="sec"><div class="sechead"><h2 class="h2">Rent</h2><button class="link" data-act="tab" data-to="bills">See bills</button></div>' + hrow(rentPeople, 'rent') + '</section>' +
    '<section class="sec"><div class="sechead"><h2 class="h2">Chores</h2><button class="link" data-act="tab" data-to="chores">See chores</button></div>' + hrow(chorePeople, 'chores') + '</section>' +
  '</div>';
};

/* ---------- user test mode ---------- */
var TASKS = [
  { id: 'rent', text: 'Pay your share of this month\'s rent.', done: function () { var b = D.bills.filter(function (x) { return x.id === 'rent'; })[0]; return !!(b && b.paid.J); } },
  { id: 'chore', text: 'You just took out the trash. Mark that chore as done.', done: function () { return D.chores.some(function (c) { return c.id === 'c1' && c.done; }); } },
  { id: 'split', text: 'You bought things at Target. Scan the receipt, split only the household items, and add it to shared expenses.', done: function () { return D.expenses.length > TEST.base.expenses; } },
  { id: 'remind', text: 'Some roommates still owe you money. Find out who, and send them a reminder.', done: function () { return !!TEST.flags.reminded; } },
  { id: 'sign', text: 'Sign the roommate agreement.', done: function () { return !!D.signed.J; } }
];
var TKEY = 'quarters-tests-v1';
var TEST = { active: false, running: false, i: -1, name: '', results: [], flags: {}, base: {}, t0: 0, taps: 0, path: [], rating: null, pending: null };
var testbar = document.getElementById('testbar');
var tm = document.getElementById('testmodal');
var tmBody = document.getElementById('testmodalBody');
var NAMES = { home: 'Home', bills: 'Bills', shared: 'Shared expenses', scan: 'Scan', split: 'Split receipt', chores: 'Chores', chorelist: 'Chore list', docs: 'Docs', agreement: 'Agreement' };
function tmShow(h) { tmBody.innerHTML = h; tm.hidden = false; tmBody.scrollTop = 0; }
function tmHide() { tm.hidden = true; }
function loadSessions() { try { return JSON.parse(localStorage.getItem(TKEY)) || []; } catch (e) { return []; } }
function saveSessions(list) { try { localStorage.setItem(TKEY, JSON.stringify(list)); } catch (e) {} }
function rebuild() {
  if (UI.sheet) { UI.sheet = null; sheetEl.classList.remove('open'); sheetEl.hidden = true; }
  UI.stack = ['home']; UI.slide = 0; UI.who = 'all'; UI.query = ''; UI.folder = null; UI.openSection = null; UI.monthView = false; UI.help = false; UI.f = blankF(); ANIM = {};
  busy = false; stage.innerHTML = '';
  var el = makeScreen('home'); el.classList.add('cur'); stage.appendChild(el); chrome(); animate(el); hooks(el);
}
function startTest() {
  if (TEST.active) return;
  TEST.active = true; TEST.running = false; TEST.i = -1; TEST.results = []; TEST.name = '';
  app.classList.add('testing'); testbar.innerHTML = '';
  D = seed(); rebuild();
  TEST.i = 0;
  taskIntro();
}
function taskIntro() {
  var t = TASKS[TEST.i];
  tmShow('<p class="k">Task ' + (TEST.i + 1) + ' of ' + TASKS.length + '</p><h2 style="margin-top:var(--s2)">' + esc(t.text) + '</h2>' +
    '<p style="margin-top:var(--s3);color:var(--muted)">The task stays at the top of the screen while you work. The app starts on Home each time.</p>' +
    '<button class="btn zelle lg" style="margin-top:var(--s5)" data-tact="go">Start task</button>');
}
function goTask() {
  tmHide(); D = seed(); rebuild();
  TEST.base = { expenses: D.expenses.length }; TEST.flags = {}; TEST.taps = 0; TEST.path = ['home']; TEST.t0 = Date.now(); TEST.running = true;
  testbar.innerHTML = '<div class="grow"><p class="tb-k">Task ' + (TEST.i + 1) + ' of ' + TASKS.length + '</p><p class="tb-t">' + esc(TASKS[TEST.i].text) + '</p></div><button class="tb-g" data-tact="giveup">Give up</button>';
}
function testCheck() {
  if (!TEST.running) return;
  if (TASKS[TEST.i].done()) finishTask(true);
}
function finishTask(ok) {
  TEST.running = false;
  var t = TASKS[TEST.i];
  TEST.pending = { task: t.id, text: t.text, ok: ok, time: Math.round((Date.now() - TEST.t0) / 100) / 10, taps: TEST.taps, path: TEST.path.map(function (p) { return NAMES[p] || p; }).join(' > ') };
  TEST.rating = null;
  setTimeout(function () { rateScreen(); }, ok ? 900 : 0);
}
function rateScreen() {
  var ok = TEST.pending.ok, btns = '';
  for (var i = 1; i <= 7; i++) btns += '<button data-tact="rate" data-v="' + i + '" aria-pressed="' + (TEST.rating === i) + '">' + i + '</button>';
  var c = document.getElementById('tComment'), keep = c ? c.value : '';
  tmShow('<p class="k">Task ' + (TEST.i + 1) + ' of ' + TASKS.length + ' · ' + (ok ? 'Complete' : 'Skipped') + '</p><h2 style="margin-top:var(--s2)">' + (ok ? 'Nice, task complete.' : 'No problem, task skipped.') + '</h2>' +
    '<p style="margin-top:var(--s3);font-weight:700">Overall, how easy or difficult was this task?</p><div class="rate">' + btns + '</div><div class="rate-l"><span>Very difficult</span><span>Very easy</span></div>' +
    '<label class="flbl" for="tComment">Anything confusing or surprising? (optional)</label><textarea id="tComment" placeholder="Type or say it out loud for the moderator to note">' + esc(keep) + '</textarea>' +
    '<button class="btn zelle lg" style="margin-top:var(--s4)" data-tact="next">' + (TEST.i + 1 < TASKS.length ? 'Next task' : 'See results') + '</button>');
}
function nextTask() {
  if (TEST.pending) {
    var c = document.getElementById('tComment');
    TEST.pending.ease = TEST.rating || '';
    TEST.pending.comment = c ? c.value.trim() : '';
    TEST.results.push(TEST.pending); TEST.pending = null;
  }
  TEST.i++;
  if (TEST.i >= TASKS.length) return summary();
  testbar.innerHTML = '';
  taskIntro();
}
function sessionRows(sess) {
  return sess.results.map(function (r) { return [sess.name || 'Anonymous', sess.date, r.task, r.ok ? 'Success' : 'Gave up', r.time, r.taps, r.ease, (r.comment || '').replace(/\s+/g, ' '), r.path].join('\t'); });
}
var THEAD = ['Participant', 'Date', 'Task', 'Result', 'Time (s)', 'Taps', 'Ease (1-7)', 'Comment', 'Path'].join('\t');
function summary() {
  testbar.innerHTML = '';
  var sess = { name: TEST.name, date: new Date().toLocaleString('en-US'), results: TEST.results };
  var all = loadSessions(); all.push(sess); saveSessions(all);
  TEST.last = sess;
  var okN = sess.results.filter(function (r) { return r.ok; }).length;
  var eases = sess.results.map(function (r) { return r.ease; }).filter(function (e) { return e; });
  var avg = eases.length ? (eases.reduce(function (a, b) { return a + b; }, 0) / eases.length).toFixed(1) : '–';
  var time = sess.results.reduce(function (a, r) { return a + r.time; }, 0);
  var rows = sess.results.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td><td>' + (r.ok ? 'Success' : '<span style="color:var(--warn-fg);font-weight:700">Gave up</span>') + '</td><td>' + r.time + ' s</td><td>' + r.taps + '</td><td>' + (r.ease || '–') + '</td></tr>'; }).join('');
  tmShow('<p class="k">Results</p><h2 style="margin-top:var(--s2)">Test complete. Thank you!</h2>' +
    '<div class="stat"><div><b>' + okN + '/' + sess.results.length + '</b><span>tasks completed</span></div><div><b>' + avg + '</b><span>average ease (1–7)</span></div><div><b>' + Math.round(time) + ' s</b><span>total time</span></div></div>' +
    '<table class="res"><thead><tr><th>Task</th><th>Result</th><th>Time</th><th>Taps</th><th>Ease</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<label class="flbl" for="tName" style="margin-top:var(--s5)">Participant name or ID (optional)</label><input class="input" id="tName" type="text" autocomplete="off" placeholder="P1">' +
    '<p style="margin-top:var(--s4);font-size:14px;line-height:20px;color:var(--muted)">Testing on your own? Tap <b>Copy results</b> and paste them into a message to the person who sent you this link.</p>' +
    '<button class="btn zelle lg" style="margin-top:var(--s3)" data-tact="copy">Copy results</button>' +
    '<button class="btn out wide" style="margin-top:var(--s3)" data-tact="copyall">Copy all sessions on this device (' + all.length + ')</button>' +
    '<button class="btn out wide" style="margin-top:var(--s3)" data-tact="again">Next participant</button>' +
    '<button class="btn out wide" style="margin-top:var(--s3)" data-tact="exit">Finish testing</button>' +
    '<div id="tCopyBox"></div>');
}
function copyText(text) {
  function fallback() {
    var box = document.getElementById('tCopyBox');
    if (!box) return;
    box.innerHTML = '<p style="margin-top:var(--s3);font-size:13px;color:var(--muted)">Copying is blocked here. Select all of this text and copy it:</p><textarea id="tCopyText" readonly style="min-height:140px;font-size:12px"></textarea>';
    var ta = document.getElementById('tCopyText'); ta.value = text; ta.focus(); ta.select();
  }
  try {
    navigator.clipboard.writeText(text).then(function () { say('Copied · paste it into Sheets, Excel or Notion'); }, fallback);
  } catch (e) { fallback(); }
}
function exitTest() {
  TEST.active = false; TEST.running = false; TEST.pending = null;
  app.classList.remove('testing'); testbar.innerHTML = ''; tmHide();
  try { D = JSON.parse(localStorage.getItem(KEY)); } catch (e) { D = null; }
  if (!D || !D.bills || !D.chores) D = seed(); else setRoster(D.size || 4); ensurePrefs();
  rebuild();
  if (location.hash === '#test') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } }
}
function syncName() {
  var n = document.getElementById('tName');
  if (!n || !TEST.last) return;
  TEST.last.name = n.value.trim();
  var all = loadSessions();
  if (all.length) { all[all.length - 1] = TEST.last; saveSessions(all); }
}
var TACT = {
  begin: function () { var n = document.getElementById('tName'); TEST.name = n ? n.value.trim() : ''; TEST.i = 0; taskIntro(); },
  go: goTask,
  giveup: function () { if (TEST.running) finishTask(false); },
  rate: function (d) { TEST.rating = +d.v; tmBody.querySelectorAll('.rate button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.v === TEST.rating)); }); },
  next: nextTask,
  copy: function () { syncName(); copyText(THEAD + '\n' + sessionRows(TEST.last).join('\n')); },
  copyall: function () { syncName(); var all = loadSessions(); copyText(THEAD + '\n' + all.map(sessionRows).reduce(function (a, b) { return a.concat(b); }, []).join('\n')); },
  again: function () { syncName(); TEST.active = false; startTest(); },
  exit: function () { syncName(); exitTest(); }
};
function tactClick(e) {
  var t = e.target.closest('[data-tact]');
  if (!t) return;
  var fn = TACT[t.dataset.tact];
  if (fn) { e.preventDefault(); fn(t.dataset); }
}
tm.addEventListener('click', tactClick);
testbar.addEventListener('click', tactClick);

var _endSwipe = null;

/* Phones: size the app to the area the browser actually draws (window.innerHeight), so the nav is never cut off,
   in Safari with its bars or opened from the Home Screen */
function fitVH() {
  var de = document.documentElement;
  var pwa = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  /* iOS Home Screen apps report a layout height shorter than the screen (it leaves out the status-bar strip),
     which left an unused band at the bottom. There, size everything to the full screen height instead. */
  var h = window.innerHeight;
  if (pwa && window.innerWidth < 600) {
    var full = window.innerWidth <= window.innerHeight ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    if (full > h) h = full;
    de.classList.add('pwa');
  } else de.classList.remove('pwa');
  de.style.setProperty('--vh', h + 'px');
}
fitVH(); window.addEventListener('resize', fitVH); window.addEventListener('orientationchange', function () { setTimeout(fitVH, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitVH);
function fitFrame() {
  if (window.innerWidth >= 600 || (window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches)) {   /* V6: a mouse means desktop, so show the phone frame even in a narrow panel */
    var sc = Math.min(1, (window.innerHeight - 56) / 874, (window.innerWidth - 56) / 402);
    app.style.setProperty('--s', Math.max(0.4, sc).toFixed(3));
  } else app.style.removeProperty('--s');
}
fitFrame();
window.addEventListener('resize', fitFrame);
function tick() {
  var d = new Date(), h = d.getHours() % 12 || 12, mi = d.getMinutes();
  var el = document.getElementById('sbTime'); if (el) el.textContent = h + ':' + (mi < 10 ? '0' : '') + mi;
}
tick(); setInterval(tick, 20000);
/* ---------- start ---------- */
var first = makeScreen('home');
first.classList.add('cur');
stage.appendChild(first);
chrome(); animate(first); hooks(first);
})();
</script>

</body>
